<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E1FITNESS</title>
<meta name="theme-color" content="#0E1116">
<link rel="icon" href="assets/icon/icon.png">
<link rel="apple-touch-icon" href="assets/icon/icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="onboardingRoot"></div>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <span class="brand-badge">E1</span>
      <span class="brand-word">FITNESS</span>
    </div>
    <span class="topbar-divider"></span>
    <span class="tl-crumbs">Track<span class="tl-sep">/</span>Progress<span class="tl-sep">/</span>Build a Stronger You</span>
    <span class="date" id="topDate">—</span>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.13.36.4.66.75.82.24.11.5.17.76.18H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>

  <div class="screen" id="screen-dashboard"></div>
  <div class="screen hidden" id="screen-workout"></div>
  <div class="screen hidden" id="screen-nutrition"></div>
  <div class="screen hidden" id="screen-progress"></div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      Home
    </button>
    <button class="tab-btn" data-tab="workout">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11"/><path d="M4 9l3-3 2.5 2.5-3 3zM20 15l-3 3-2.5-2.5 3-3z"/></svg>
      Train
    </button>
    <button class="tab-btn" data-tab="nutrition">
      <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 2v3M10 2v3M14 2v3"/></svg>
      Fuel
    </button>
    <button class="tab-btn" data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      Progress
    </button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>
<div id="restTimerRoot"></div>

<script src="js/native-bridge.js"></script>
<script src="js/app.js"></script>
<script src="js/version-check.js"></script>
</body>
</html>
