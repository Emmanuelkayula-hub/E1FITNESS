name: Deploy web app to GitHub Pages

# Publishes src/ (the web layer Capacitor also wraps) to GitHub Pages on
# every push to this branch, so the hosted URL always reflects the latest
# commit — no manual zip/unzip/re-upload needed to test on a phone.
#
# One-time setup required (can't be done from a workflow file): in the
# repo's Settings -> Pages, set "Source" to "GitHub Actions". After that,
# this runs automatically on every push here.

on:
  push:
    branches:
      - claude/e1fitness-redesign-m1nzsz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Stamps this build with the commit SHA so the phone can tell it's
      # running stale code (js/version-check.js compares against this) and
      # cache-busts app.css/app.js/native-bridge.js/version-check.js so a
      # browser that cached the previous deploy's copies is forced to fetch
      # the new ones instead of reusing them under the same URL. Runs on
      # the checked-out copy only — nothing here is ever committed back to
      # the repo, and it never touches anything under localStorage/the DB.
      - name: Stamp build version
        run: |
          VERSION="${GITHUB_SHA::7}"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "{\"version\":\"$VERSION\",\"deployedAt\":\"$DEPLOYED_AT\"}" > src/version.json
          sed -i \
            -e "s#<title>E1FITNESS</title>#<title>E1FITNESS</title>\n<script>window.E1_BUILD_VERSION=\"$VERSION\";</script>#" \
            -e "s#css/app.css#css/app.css?v=$VERSION#" \
            -e "s#js/native-bridge.js#js/native-bridge.js?v=$VERSION#" \
            -e "s#js/app.js#js/app.js?v=$VERSION#" \
            -e "s#js/version-check.js#js/version-check.js?v=$VERSION#" \
            src/index.html
          echo "Stamped build $VERSION"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
